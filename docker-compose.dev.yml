services:
  postgres:
    image: postgres:18.1
    container_name: express-ts-drizzle-base-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - express-ts-drizzle-base-dev-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: express-ts-drizzle-base-api-dev
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://postgres:secret@postgres:5432/postgres
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-90d}
      JWT_COOKIE_EXPIRES_IN: ${JWT_COOKIE_EXPIRES_IN:-90}
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .git/
            - dist/
            - logs/
            - node_modules/
            - npm-debug.log*
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - express-ts-drizzle-base-dev-network

volumes:
  postgres-dev:

networks:
  express-ts-drizzle-base-dev-network:
